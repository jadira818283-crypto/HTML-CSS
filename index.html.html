                    "Контенттің мөлдірлігін бақылайтын қасиет",

            },
            {
                id: 11,
                topic: "8. Псевдокластар",
                question: "CSS Псевдокласы (Pseudo-class) дегеніміз не?",

                    "Тек суреттерді үлкейткіш құрал"
                ],
                correct: 0,
                explain: "Анкорлық сілтемелер (#id арқылы) пайдаланушыны дәл сонымен белгіленген беттің белгілі бір бөлігіне бірден жылжытады."
            },
            {
                id: 13,
                topic: "7. Түстер мен Фондар",
                question: "HEX түс форматы дегеніміз не?",
                options: [
                    "Қызыл, жасыл және көк түстердің қанықтылығын 16-лық санау жүйесінде (#RRGGBB) белгілеу форматы",

            },
            {
                id: 14,
                topic: "4. Кестелер мен Тізімдер",
                question: "HTML-дегі <th> тегінің анықтамасы?",
                options: [
                    "Кестенің қарапайым деректер ұяшығы",
                    "Кестенің тақырыптық, жуан әрі орталанған ұяшығын анықтайтын тег",
                    "Кестенің сыртқы жиегінің қалыңдығы",
                    "Кестені жоятын арнайы тег"
                ],
                correct: 1,
                explain: "<th> (Table Header) тегі кестенің баған немесе жол тақырыптарын анықтайды, ондағы мәтін әдепкіде жуан әрі ортадан жазылады."
            },
            {
                id: 15,
                topic: "9. CSS Каскадтылық",
                question: "CSS-тегі Каскадтылық (Cascading) ұғымы дегеніміз не?",
                options: [
                    "Стильдердің иерархиясы мен басымдығы бойынша жоғарыдан төмен қарай ретпен қолданылу ережесі",
                    "Кодты файлдарға бөліп сақтау тәсілі",
                    "Тек анимациялардың жылдамдығын реттеу",
                    "Браузер терезесінің өлшемін өзгерту мүмкіндігі"
                ],
                correct: 0,
                explain: "Каскадтылық — бір элементке бірнеше стиль қолданылғанда, қай стильдің басымдыққа (приоритетке) ие болатынын анықтайтын ережелер жиынтығы."
            }
        ];

        // Application State
        let currentModuleIndex = 0;
        let currentQuizIndex = 0;
        let quizScore = 0;
        let selectedOption = null;

        // Initialize Application
        window.onload = function() {
            renderModulesNav();
            loadModule(0);
            initTheme();
        };

        // Render Sidebar Navigation
        function renderModulesNav() {
            const nav = document.getElementById('moduleList');
            nav.innerHTML = modulesData.map((mod, idx) => `
                <button onclick="loadModule(${idx})" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition flex items-center justify-between ${idx === currentModuleIndex ? 'bg-blue-50 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400 font-semibold' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700'}">
                    <span class="truncate">${mod.title}</span>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
                </button>
            `).join('');
        }

        // Load Specific Module Content
        function loadModule(index) {
            currentModuleIndex = index;
            renderModulesNav();
            const mod = modulesData[index];
            const viewer = document.getElementById('contentViewer');
            
            viewer.innerHTML = `
                <div class="space-y-4">
                    <div class="inline-block px-3 py-1 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 rounded-full text-xs font-semibold uppercase tracking-wider">
                        Модуль ${mod.id} / ${modulesData.length}
                    </div>
                    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">${mod.title}</h1>
                    <p class="text-gray-500 dark:text-gray-400 text-sm border-b border-gray-100 dark:border-gray-700 pb-4">${mod.description}</p>
                    <div class="prose dark:prose-invert max-w-none pt-2">
                        ${mod.content}
                    </div>
                </div>
            `;

            // Load module sample code into editor
            if(mod.sampleCode) {
                document.getElementById('codeEditor').value = mod.sampleCode;
                runCode();
            }
        }

        // Live Code Editor Logic
        function runCode() {
            const code = document.getElementById('codeEditor').value;
            const preview = document.getElementById('codePreview');
            const previewDoc = preview.contentDocument || preview.contentWindow.document;
            previewDoc.open();
            previewDoc.write(code);
            previewDoc.close();
        }

        function resetEditorCode() {
            document.getElementById('codeEditor').value = '';
            runCode();
        }

        // Quiz System Functions
        function openQuiz() {
            currentQuizIndex = 0;
            quizScore = 0;
            selectedOption = null;
            document.getElementById('quizModal').classList.remove('hidden');
            renderQuizStep();
        }

        function closeQuiz() {
            document.getElementById('quizModal').classList.add('hidden');
        }

        function renderQuizStep() {
            const container = document.getElementById('quizContent');
            const footer = document.getElementById('quizFooter');

            if (currentQuizIndex >= quizData.length) {
                // Quiz Complete View
                container.innerHTML = `
                    <div class="text-center py-8 space-y-4">
                        <div class="w-20 h-20 bg-amber-100 dark:bg-amber-900/40 text-amber-500 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900 dark:text-white">Тест аяқталды!</h3>
                        <p class="text-gray-600 dark:text-gray-300">Сіз 15 анықтамалық сұрақтың <strong>${quizScore}</strong> сұрағына дұрыс жауап бердіңіз.</p>
                        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 max-w-md mx-auto overflow-hidden">
                            <div class="bg-amber-500 h-full transition-all duration-500" style="width: ${(quizScore/quizData.length)*100}%"></div>
                        </div>
                        <button onclick="openQuiz()" class="mt-4 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition shadow">
                            Қайта тапсыру
                        </button>
                    </div>
                `;
                footer.classList.add('hidden');
                return;
            }

            footer.classList.remove('hidden');
            selectedOption = null;
            const q = quizData[currentQuizIndex];

            document.getElementById('quizProgress').innerText = `Сұрақ ${currentQuizIndex + 1} / ${quizData.length}`;
            document.getElementById('nextBtn').disabled = true;

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="text-xs font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wider">${q.topic}</div>
                    <h4 class="text-lg font-bold text-gray-900 dark:text-white">${q.question}</h4>
                    <div class="space-y-2.5 pt-2">
                        ${q.options.map((opt, i) => `
                            <button id="opt-${i}" onclick="selectOption(${i})" class="w-full text-left p-4 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-blue-500 dark:hover:border-blue-400 bg-white dark:bg-gray-750 transition flex items-start space-x-3 text-sm">
                                <span class="w-6 h-6 rounded-full border border-gray-300 dark:border-gray-600 flex items-center justify-center text-xs font-bold text-gray-500 shrink-0 mt-0.5">${String.fromCharCode(65 + i)}</span>
                                <span class="text-gray-700 dark:text-gray-200">${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div id="explainBox" class="hidden p-4 rounded-xl text-sm bg-blue-50 dark:bg-blue-900/30 text-blue-800 dark:text-blue-200 border border-blue-200 dark:border-blue-800">
                        <strong>Түсініктеме:</strong> ${q.explain}
                    </div>
                </div>
            `;
        }

        function selectOption(index) {
            if (selectedOption !== null) return; // Prevent changing after selection
            selectedOption = index;
            const q = quizData[currentQuizIndex];
            const isCorrect = index === q.correct;

            if (isCorrect) quizScore++;

            // Update Option UI
            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                btn.disabled = true;
                if (i === q.correct) {
                    btn.classList.add('bg-green-50', 'dark:bg-green-900/30', 'border-green-500', 'text-green-800', 'dark:text-green-300');
                } else if (i === index && !isCorrect) {
                    btn.classList.add('bg-red-50', 'dark:bg-red-900/30', 'border-red-500', 'text-red-800', 'dark:text-red-300');
                }
            });

            document.getElementById('explainBox').classList.remove('hidden');
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            currentQuizIndex++;
            renderQuizStep();
        }

        // Dark/Light Theme Switcher
        const themeToggle = document.getElementById('themeToggle');
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });
    </script>
